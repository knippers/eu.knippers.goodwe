<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>

  <body>
    <fieldset class="homey-form-fieldset" style="margin-top: 0">
      <div class="homey-form-group">
        <label class="homey-form-label" for="ip_address">IP address</label>
        <input
          class="homey-form-input"
          id="ip_address"
          type="text"
          placeholder="192.168.0.50"
        />
      </div>

      <div class="homey-form-group">
        <label class="homey-form-label" for="port">TCP port</label>
        <input class="homey-form-input" id="port" type="number" value="502" />
      </div>

      <div class="homey-form-group">
        <label class="homey-form-label" for="modbus_id">Modbus ID (1-247)</label>
        <input class="homey-form-input" id="modbus_id" type="number" value="1" />
      </div>

      <div class="homey-form-group">
        <label class="homey-form-label" for="poll_interval"
          >Polling interval (minutes, minimum 1)</label
        >
        <input
          class="homey-form-input"
          id="poll_interval"
          type="number"
          min="1"
          value="5"
        />
      </div>

      <div>
        <div class="flex-container">
          <div class="item-left" id="result"></div>
        </div>
        <div class="button-group">
          <button id="submit" class="homey-button-primary">
            Check connection
          </button>
          <button
            id="continue"
            class="homey-button-primary"
            style="display: none"
          >
            Continue
          </button>
        </div>
      </div>
    </fieldset>

    <script type="text/javascript">
      const getVal = (id) => document.getElementById(id).value;
      const setTxt = (id, txt) => (document.getElementById(id).innerHTML = txt);

      Homey.setTitle("GoodWe");
      Homey.setSubtitle("Connect your GoodWe inverter via Modbus TCP");

      const continueButton = document.getElementById("continue");
      let verified = false;

      const setVerified = (value) => {
        verified = value;
        continueButton.style.display = value ? "" : "none";
      };

      // Any change to the settings invalidates the last check.
      const resetVerification = () => {
        setTxt("result", "");
        setVerified(false);
      };

      ["ip_address", "port", "modbus_id", "poll_interval"].forEach((id) =>
        document.getElementById(id).addEventListener("input", resetVerification)
      );

      document.getElementById("submit").onclick = (e) => {
        e.preventDefault();
        resetVerification();

        const connection = {
          ip_address: getVal("ip_address").trim(),
          port: Number(getVal("port") || 502),
          modbus_id: Number(getVal("modbus_id") || 1),
          poll_interval: Number(getVal("poll_interval") || 5),
        };

        Homey.showLoadingOverlay();
        Homey.emit("connect", connection, (err, result) => {
          Homey.hideLoadingOverlay();
          if (err) {
            Homey.alert(err, "error", () => {});
          } else {
            setTxt("result", result);
            setVerified(true);
          }
        });
      };

      // Only reachable after a successful check.
      continueButton.onclick = (e) => {
        e.preventDefault();
        if (!verified) return;
        Homey.showView("list_devices");
      };
    </script>

    <style>
      .flex-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .item-left {
        color: green;
        flex-grow: 1;
      }

      .button-group {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        margin-top: 16px;
      }
    </style>
  </body>
</html>
